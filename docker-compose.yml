services:
  laya-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laya-nepali-decision-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LAYA_DOMAIN=clothing
      - LAYA_DEVICE=cpu
      - LAYA_MODEL_PATH=data/checkpoints/clothing_v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
