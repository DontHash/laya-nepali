[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-nepali"
version = "0.1.0"
description = "Nepali typed-decision dataset, fine-tune, and benchmark for the Laya System 1 decision model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DontHash" }]
keywords = ["nepali", "laya", "system-one", "typed-decisions", "calibration", "low-resource"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
model = [
    "laya==0.3.20",
]
gen = [
    "google-genai>=1.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["layanep", "layanep.benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
