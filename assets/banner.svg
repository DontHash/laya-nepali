<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Subtle Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C2E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="100" r="180" fill="#0284C7" opacity="0.04" filter="blur(60px)" />
  <circle cx="1000" cy="300" r="200" fill="#4F46E5" opacity="0.04" filter="blur(70px)" />

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->

  <!-- Top Badge -->
  <rect x="64" y="52" width="280" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="80" cy="67" r="4" fill="#38BDF8" />
  <text x="94" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="1">JEV FOR NEPAL  •  SYSTEM 1</text>

  <!-- Main Title -->
  <text x="64" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">
    Laya Nepali
  </text>
  <text x="375" y="140" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="46" font-weight="600" fill="#64748B" letter-spacing="-0.5">
    लय नेपाली
  </text>

  <!-- Subtitle -->
  <text x="64" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
    High-speed, non-autoregressive decision model and runtime
  </text>
  <text x="64" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="-0.2">
    engineered for Nepali conversational commerce and logistics.
  </text>

  <!-- Metric Pills Row -->
  <g transform="translate(64, 252)">
    <!-- Pill 1: Latency -->
    <rect x="0" y="0" width="145" height="54" rx="10" fill="#141E33" stroke="#25334D" stroke-width="1" />
    <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-transform="uppercase" letter-spacing="0.5">LATENCY (GPU)</text>
    <text x="16" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#38BDF8">28.1 ms</text>

    <!-- Pill 2: Accuracy -->
    <rect x="157" y="0" width="145" height="54" rx="10" fill="#141E33" stroke="#25334D" stroke-width="1" />
    <text x="173" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-transform="uppercase" letter-spacing="0.5">ACCURACY</text>
    <text x="173" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#34D399">93.0%</text>

    <!-- Pill 3: Safety FP -->
    <rect x="314" y="0" width="145" height="54" rx="10" fill="#141E33" stroke="#25334D" stroke-width="1" />
    <text x="330" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-transform="uppercase" letter-spacing="0.5">UNSAFE COMMANDS</text>
    <text x="330" y="44" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">0 (Zero)</text>
  </g>

  <!-- Tagline / Provenance Badge -->
  <text x="64" y="352" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#475569">
    Fine-tuned on curated multi-turn Nepali commerce datasets  •  Apache 2.0  •  Open Source
  </text>


  <!-- ================= RIGHT COLUMN: SLEEK PREVIEW CARD ================= -->

  <g transform="translate(620, 52)">
    <!-- Terminal / Preview Window -->
    <rect width="516" height="316" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />

    <!-- Window Header -->
    <path d="M 0 12 Q 0 0 12 0 L 504 0 Q 516 0 516 12 L 516 42 L 0 42 Z" fill="#0C1322" />
    <line x1="0" y1="42" x2="516" y2="42" stroke="#1E293B" stroke-width="1" />

    <!-- macOS dots -->
    <circle cx="20" cy="21" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="36" cy="21" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="52" cy="21" r="5" fill="#10B981" opacity="0.8" />
    <text x="72" y="25" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">System 1 Live Inference Runtime</text>
    <rect x="424" y="12" width="76" height="18" rx="4" fill="#1E293B" />
    <text x="432" y="25" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#38BDF8">POST /v1</text>

    <!-- Card Content -->
    <!-- Input Section -->
    <text x="24" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">CUSTOMER QUERY (NEPALI)</text>
    <rect x="24" y="80" width="468" height="42" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
    <text x="38" y="106" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="14" fill="#F1F5F9">
      "सामान घर आइपुगेपछि नगद तिर्न पाइन्छ?"
    </text>

    <!-- Decision Flow Divider -->
    <line x1="24" y1="140" x2="492" y2="140" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Decision Result -->
    <text x="24" y="165" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.5">CLASSIFIED INTENT &amp; POLICY GUARD</text>

    <!-- Result Box -->
    <rect x="24" y="176" width="468" height="120" rx="8" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />

    <!-- Field 1: Intent -->
    <text x="40" y="202" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Predicted Intent:</text>
    <text x="145" y="202" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#38BDF8">fulfillment.ask_cod</text>

    <!-- Field 2: Confidence -->
    <text x="40" y="226" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Confidence:</text>
    <text x="145" y="226" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#34D399">0.9092 (90.9%)  •  p(none): 0.0000</text>

    <!-- Field 3: Action -->
    <text x="40" y="250" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Policy Routing:</text>
    <rect x="145" y="238" width="130" height="18" rx="4" fill="#065F46" fill-opacity="0.4" stroke="#059669" stroke-width="0.8" />
    <text x="153" y="251" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#34D399">TIER 0: AUTO-SERVE</text>

    <!-- Field 4: Template Output -->
    <text x="40" y="278" font-family="-apple-system, sans-serif" font-size="12" fill="#94A3B8">Response:</text>
    <text x="145" y="278" font-family="'Noto Sans Devanagari', -apple-system, sans-serif" font-size="12.5" fill="#E2E8F0">
      "हो, क्यास अन डेलिभरी (COD) उपलब्ध छ।"
    </text>
  </g>
</svg>
